name: 每日跨平台热门软件榜单

on:
  schedule:
    # UTC 00:30，即北京时间 08:30
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: daily-cross-platform-trending
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装项目
        run: python -m pip install .

      - name: 运行测试
        run: python -m unittest discover -s tests -v

      - name: 生成当天榜单
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cross-platform-trending --limit 100 --max-candidates 1000

      - name: 提交报告
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data
          if git diff --cached --quiet; then
            echo "报告没有变化，无需提交"
            exit 0
          fi
          git commit -m "chore: 更新 $(TZ=Asia/Shanghai date +%F) 热门软件榜单"
          git push
