[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "github-cross-platform-trending"
version = "0.8.1"
description = "每日生成 GitHub 跨平台热门软件与热门增长仓库双榜单"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "masongzhi" }]
dependencies = []

[project.scripts]
cross-platform-trending = "cross_platform_trending.cli:main"
github-hot-rising = "github_hot_rising.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
